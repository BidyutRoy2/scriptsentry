<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScriptSentry</title>
    <style>
      :root { color-scheme: dark; }
      body { font-family: system-ui, sans-serif; background: #0e1116; color: #e8e9eb; width: 340px; margin: 0; padding: 14px; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { color: #9aa3ad; font-size: 12px; margin-bottom: 10px; word-break: break-all; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: #171b22; border: 1px solid #262c36; border-radius: 8px; margin-bottom: 6px; }
      .name { font-size: 13px; font-weight: 600; }
      .score { font-size: 12px; font-weight: 700; }
      .a { color: #3fb96f; } .b { color: #8bc34a; } .c { color: #e6c229; } .d { color: #ef8f3c; } .f { color: #ef5350; }
      button { background: #232833; color: #e8e9eb; border: 1px solid #333b48; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
      button.on { background: #14532d; border-color: #1f7a43; }
      #dash { width: 100%; margin-top: 8px; background: #2563eb; border-color: #2563eb; padding: 8px; font-weight: 600; }
      .empty { color: #9aa3ad; font-size: 13px; padding: 10px 0; }
      #warn { display: none; background: #3a2a12; border: 1px solid #7a5518; color: #f2c879; font-size: 12px; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <h1>🛡️ ScriptSentry</h1>
    <div class="sub" id="url">Current tab</div>
    <div id="warn">chrome.userScripts is unavailable — enable <b>Allow User Scripts</b> for ScriptSentry in chrome://extensions, then reopen this popup.</div>
    <div id="list"></div>
    <button id="dash">Open dashboard</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
